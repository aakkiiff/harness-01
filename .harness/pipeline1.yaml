pipeline:
  name: pipeline-1
  identifier: pipeline1
  projectIdentifier: project1
  orgIdentifier: default
  tags: {}
  stages:
    - stage:
        name: random-approval
        identifier: randomapproval
        description: ""
        type: Approval
        spec:
          execution:
            steps:
              - step:
                  name: approval-001
                  identifier: approval001
                  type: HarnessApproval
                  timeout: 1d
                  spec:
                    approvalMessage: |-
                      Please review the following information
                      and approve the pipeline progression
                    includePipelineExecutionHistory: true
                    approvers:
                      minimumCount: 1
                      disallowPipelineExecutor: false
                      userGroups:
                        - account._account_all_users
                    isAutoRejectEnabled: false
                    approverInputs: []
        tags: {}
    - stage:
        name: test-stage
        identifier: teststage
        description: ""
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: whoami
                  identifier: whoami
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: whoami
                    environmentVariables: []
                    outputVariables: []
                  timeout: 10m
              - step:
                  type: ShellScript
                  name: ShellScript_2
                  identifier: ShellScript_2
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: |-
                          ls
                          pwd
                    environmentVariables: []
                    outputVariables: []
                  timeout: 10m
        tags: {}
